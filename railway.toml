# Railway "config as code". Settings here override the dashboard for this service.
[deploy]
# Runs BEFORE each new version starts. Applies only pending schema migrations
# (adds tables/columns). It never drops, truncates or re-creates data.
preDeployCommand = "python -m flask --app app db-migrate"
startCommand = "gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile -"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
