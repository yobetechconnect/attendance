{% extends "base.html" %}
{% block title %}Sections{% endblock %}
{% block page_title %}Sections{% endblock %}
{% block content %}
<div class="section">
  <h2>Create Section</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="filter-bar">
      <div class="form-group"><label>Name</label><input type="text" name="name" placeholder="e.g. Secondary" required></div>
      <div class="form-group"><label>Description</label><input type="text" name="description"></div>
    </div>
    <button type="submit" class="btn btn-primary">Create</button>
  </form>
</div>
<div class="section">
  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Description</th></tr></thead>
      <tbody>
        {% for s in rows %}
        <tr><td>{{ s.name }}</td><td>{{ s.description or '—' }}</td></tr>
        {% else %}
        <tr><td colspan="2">No sections yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
