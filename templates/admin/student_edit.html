{% extends "base.html" %}
{% block title %}Edit {{ student.first_name }}{% endblock %}
{% block page_title %}Edit Student{% endblock %}
{% block content %}
<div class="section">
  <p class="muted">Admission number <strong>{{ student.admission_number }}</strong> cannot be changed (it is the student's login identity).</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="filter-bar">
      <div class="form-group"><label>First Name</label><input type="text" name="first_name" value="{{ student.first_name }}" required></div>
      <div class="form-group"><label>Middle Name</label><input type="text" name="middle_name" value="{{ student.middle_name or '' }}"></div>
      <div class="form-group"><label>Surname</label><input type="text" name="surname" value="{{ student.surname }}" required></div>
      <div class="form-group"><label>Class</label>
        <select name="class_id" required>{% for c in classes %}<option value="{{ c.id }}" {% if student.class_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
      <div class="form-group"><label>Gender</label>
        <select name="gender"><option value="">--</option><option value="male" {% if student.gender == 'male' %}selected{% endif %}>Male</option><option value="female" {% if student.gender == 'female' %}selected{% endif %}>Female</option></select></div>
      <div class="form-group"><label>Date of Birth</label><input type="date" name="date_of_birth" value="{{ student.date_of_birth or '' }}"></div>
      <div class="form-group"><label>Phone</label><input type="text" name="phone" value="{{ student.phone or '' }}"></div>
      <div class="form-group"><label>Address</label><input type="text" name="address" value="{{ student.address or '' }}"></div>
      <div class="form-group"><label>Qur'anic Level</label><input type="text" name="quranic_level" value="{{ student.quranic_level or '' }}"></div>
    </div>
    <button class="btn btn-primary" type="submit">Save changes</button>
    <a class="btn btn-outline" href="{{ url_for('admin_people.student_view', student_id=student.id) }}">Cancel</a>
  </form>
</div>
{% endblock %}
