{% extends "parent/base_parent.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="pp-panel pp-form">
  <h2>Change password</h2>
  {% if forced %}<div class="alert-banner">You are using a temporary password. Please choose your own to continue.</div>{% endif %}
  <form method="post" action="{{ url_for('auth.change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label for="cp">Current password</label><input type="password" id="cp" name="current_password" required autocomplete="current-password"></div>
    <div class="form-group"><label for="np">New password</label><input type="password" id="np" name="new_password" required minlength="8" autocomplete="new-password">
      <small class="muted">At least 8 characters, with a letter and a number.</small></div>
    <div class="form-group"><label for="cf">Confirm new password</label><input type="password" id="cf" name="confirm_password" required minlength="8" autocomplete="new-password"></div>
    <button class="btn btn-primary" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
