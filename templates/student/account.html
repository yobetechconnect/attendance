{% extends "base.html" %}
{% block title %}Account Settings{% endblock %}
{% block page_title %}Account Settings{% endblock %}
{% block content %}
<div class="section" style="max-width:480px;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" value="{{ g.user.full_name }}" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ g.user.email }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>
</div>

<div class="section" style="max-width:480px;">
  <h3 style="margin-top:0;">Change Password</h3>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="full_name" value="{{ g.user.full_name }}">
    <input type="hidden" name="email" value="{{ g.user.email }}">
    <div class="form-group">
      <label for="current_password">Current Password</label>
      <input type="password" id="current_password" name="current_password" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label for="new_password">New Password</label>
      <input type="password" id="new_password" name="new_password" minlength="8" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm New Password</label>
      <input type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-outline">Update Password</button>
  </form>
</div>
{% endblock %}
