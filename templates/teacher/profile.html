{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block page_title %}My Profile{% endblock %}
{% block content %}
<div class="section" style="max-width:480px;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label>Full Name</label><input type="text" name="full_name" value="{{ g.user.full_name }}" required></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ g.user.email }}" required></div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>
</div>
<div class="section" style="max-width:480px;">
  <h3 style="margin-top:0;">Change Password</h3>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="full_name" value="{{ g.user.full_name }}">
    <input type="hidden" name="email" value="{{ g.user.email }}">
    <div class="form-group"><label>Current Password</label><input type="password" name="current_password" autocomplete="current-password"></div>
    <div class="form-group"><label>New Password</label><input type="password" name="new_password" minlength="8" autocomplete="new-password"></div>
    <div class="form-group"><label>Confirm New Password</label><input type="password" name="confirm_password" minlength="8" autocomplete="new-password"></div>
    <button type="submit" class="btn btn-outline">Update Password</button>
  </form>
</div>
{% endblock %}
